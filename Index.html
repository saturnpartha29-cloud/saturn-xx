<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SATURN XX</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial, sans-serif;
  background:#09090f;
  color:white;
  height:100vh;
  overflow:hidden;
}

.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:270px;
  background:#101018;
  border-right:1px solid #272733;
  padding:18px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:23px;
  font-weight:800;
  margin-bottom:25px;
}

.logo span{
  color:#a875ff;
}

.newchat{
  border:1px solid #39394a;
  background:#181824;
  color:white;
  border-radius:12px;
  padding:13px;
  cursor:pointer;
  margin-bottom:20px;
}

.newchat:hover{
  background:#242433;
}

.history-title{
  color:#858596;
  font-size:12px;
  margin:10px 5px;
}

.chat-item{
  padding:11px;
  border-radius:9px;
  color:#c9c9d5;
  margin-bottom:4px;
  cursor:pointer;
}

.chat-item:hover{
  background:#1d1d29;
}

.settings{
  margin-top:auto;
  padding:12px;
  color:#aaa;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar{
  height:65px;
  border-bottom:1px solid #272733;
  display:flex;
  align-items:center;
  padding:0 20px;
}

.mobile-menu{
  display:none;
  font-size:25px;
  margin-right:15px;
}

.brand{
  font-size:20px;
  font-weight:800;
}

.brand span{
  color:#a875ff;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:35px 20px 150px;
}

.welcome{
  max-width:750px;
  margin:80px auto 30px;
  text-align:center;
}

.saturn{
  font-size:65px;
  margin-bottom:15px;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.welcome h1{
  font-size:38px;
  margin-bottom:12px;
}

.welcome h1 span{
  color:#a875ff;
}

.welcome p{
  color:#9999a8;
  font-size:16px;
}

.message{
  max-width:800px;
  margin:18px auto;
  padding:16px 18px;
  border-radius:15px;
  line-height:1.6;
}

.user{
  background:#252538;
}

.ai{
  background:#14141d;
  border:1px solid #292936;
}

.label{
  font-size:12px;
  color:#a875ff;
  font-weight:bold;
  margin-bottom:7px;
}

/* SUGGESTIONS */
.suggestions{
  max-width:800px;
  margin:25px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.suggestion{
  background:#12121b;
  border:1px solid #292936;
  border-radius:13px;
  padding:15px;
  color:#ddd;
  cursor:pointer;
  transition:.2s;
}

.suggestion:hover{
  border-color:#8b62d9;
  transform:translateY(-2px);
}

/* INPUT */
.composer{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:min(850px,92%);
  background:#15151f;
  border:1px solid #383846;
  border-radius:18px;
  padding:8px;
  display:flex;
  align-items:center;
  box-shadow:0 10px 35px #0008;
}

.composer input{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  padding:13px;
  font-size:15px;
}

.composer button{
  width:44px;
  height:44px;
  border:0;
  border-radius:12px;
  background:#8b5cf6;
  color:white;
  font-size:19px;
  cursor:pointer;
}

.footer{
  text-align:center;
  color:#686875;
  font-size:10px;
  margin-bottom:5px;
}

/* MOBILE */
@media(max-width:700px){
  .sidebar{
    display:none;
  }

  .mobile-menu{
    display:block;
  }

  .welcome{
    margin-top:50px;
  }

  .welcome h1{
    font-size:30px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }

  .chat{
    padding-left:12px;
    padding-right:12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">🪐 SATURN <span>XX</span></div>

    <button class="newchat" onclick="newChat()">＋ New Chat</button>

    <div class="history-title">RECENT CHATS</div>

    <div id="history">
      <div class="chat-item">Welcome to SATURN XX</div>
    </div>

    <div class="settings">⚙ Settings</div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="mobile-menu">☰</div>
      <div class="brand">🪐 SATURN <span>XX</span></div>
    </header>

    <section class="chat" id="chat">

      <div class="welcome" id="welcome">
        <div class="saturn">🪐</div>

        <h1>Welcome to <span>SATURN XX</span></h1>

        <p>Your AI. Your Space.<br>
        Ask anything, learn anything, create anything.</p>
      </div>

      <div class="suggestions" id="suggestions">

        <div class="suggestion"
          onclick="ask('Explain Artificial Intelligence in simple words')">
          🤖 Explain something
        </div>

        <div class="suggestion"
          onclick="ask('Help me study for my exam')">
          📚 Help me study
        </div>

        <div class="suggestion"
          onclick="ask('Give me some creative ideas')">
          💡 Give me ideas
        </div>

        <div class="suggestion"
          onclick="ask('Help me solve this problem')">
          🧠 Solve a problem
        </div>

      </div>

    </section>

    <div class="composer">
      <input
        id="input"
        type="text"
        placeholder="Message SATURN XX..."
        onkeydown="if(event.key==='Enter') sendMessage()">

      <button onclick="sendMessage()">➤</button>
    </div>

    <div class="footer">
      SATURN XX can make mistakes. Check important information.
    </div>

  </main>
</div>

<script>

function sendMessage(){
  const input=document.getElementById("input");
  const text=input.value.trim();

  if(!text)return;

  ask(text);
  input.value="";
}

function ask(text){

  const chat=document.getElementById("chat");
  const welcome=document.getElementById("welcome");
  const suggestions=document.getElementById("suggestions");

  if(welcome) welcome.style.display="none";
  if(suggestions) suggestions.style.display="none";

  const user=document.createElement("div");
  user.className="message user";
  user.innerHTML="<div class='label'>YOU</div>"+escapeHTML(text);
  chat.appendChild(user);

  const ai=document.createElement("div");
  ai.className="message ai";
  ai.innerHTML=
    "<div class='label'>SATURN XX</div>"+
    "I'm ready to help with that. 🚀<br><br>"+
    "Real AI connection will be added in the next step.";
  chat.appendChild(ai);

  chat.scrollTop=chat.scrollHeight;
}

function newChat(){
  location.reload();
}

function escapeHTML(text){
  const div=document.createElement("div");
  div.textContent=text;
  return div.innerHTML;
}

</script>

</body>
</html>
